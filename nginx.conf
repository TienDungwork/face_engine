events {
    worker_connections 1024;
}

http {
    upstream face_engine_backend {
        # Round-robin load balancing across 4 GPU services
        server lpb-face-engine-1:8000;
        server lpb-face-engine-2:8000;
        server lpb-face-engine-3:8000;
        server lpb-face-engine-4:8000;
        
        # Alternative: least connections
        # least_conn;
        
        # Alternative: ip_hash for session persistence
        # ip_hash;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API endpoints
        location / {
            proxy_pass http://face_engine_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Static files (if any)
        location /static/ {
            proxy_pass http://face_engine_backend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, immutable";
        }
    }
} 