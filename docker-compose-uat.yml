services:
  lpb-face-engine-uat-1:
    image: huyquang/attendance-recognize-service:latest
    command: /bin/bash -c "cd /project && python3 -u run.py"
    restart: always
    volumes:
      - ./:/project
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "8"
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    env_file:
      - resources/.env
    networks:
      - face-engine-network-uat-1

  nginx-uat:
    image: nginx:alpine
    restart: always
    ports:
      - "42070:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lpb-face-engine-uat-1
    networks:
      - face-engine-network-uat-1

networks:
  face-engine-network-uat-1:
    driver: bridge
