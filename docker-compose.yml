services:
  lpb-face-engine-1:
    image: huyquang/attendance-recognize-service:latest
    command: /bin/bash -c "cd /project && python3 -u run.py"
    restart: always
    volumes:
      - ./:/project
    ports:
      - "192.168.1.191:54327:8000"
    deploy:
      resources:
        limits:
          cpus: "4"
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    env_file:
      - resources/.env
    networks:
      - face-engine-network

